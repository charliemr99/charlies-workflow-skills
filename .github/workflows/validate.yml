name: Validate skills

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.8.13"

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Check authored formats
        run: |
          bash -n scripts/install.sh scripts/uninstall.sh scripts/validate.sh
          python -m json.tool manifest.json >/dev/null
          python -m json.tool evals/charlies-workflow-cases.json >/dev/null
          python -m json.tool evals/deterministic-lifecycle.json >/dev/null

      - name: Validate bundled skills and contracts
        run: ./scripts/validate.sh

      - name: Exercise project and user install round trips
        run: |
          project="$RUNNER_TEMP/project"
          user_home="$RUNNER_TEMP/user-home"
          mkdir -p "$project" "$user_home"

          if ./scripts/install.sh --dry-run; then
            echo "Install without an explicit destination unexpectedly succeeded." >&2
            exit 1
          fi

          ./scripts/install.sh --scope project --project-dir "$project" \
            --harness codex --skill charlies-workflow
          project_target="$project/.agents/skills"
          test -f "$project_target/.charlies-workflow-skills/receipt.json"
          ./scripts/validate.sh --skills-dir "$project_target"
          ./scripts/uninstall.sh --scope project --project-dir "$project" \
            --harness codex
          test ! -e "$project_target/charlies-workflow"
          test ! -e "$project_target/.charlies-workflow-skills/receipt.json"

          HOME="$user_home" ./scripts/install.sh --scope user --harness claude \
            --skill charlies-workflow
          user_target="$user_home/.claude/skills"
          test -f "$user_target/.charlies-workflow-skills/receipt.json"
          grep -q '^disable-model-invocation: true$' \
            "$user_target/charlies-workflow/SKILL.md"
          HOME="$user_home" ./scripts/uninstall.sh --scope user --harness claude
          test ! -e "$user_target/charlies-workflow"
          test ! -e "$user_target/.charlies-workflow-skills/receipt.json"
