name: Validate skills

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Check authored formats
        run: |
          bash -n scripts/install.sh scripts/validate.sh
          python -m json.tool manifest.json >/dev/null
          python -m json.tool evals/charlies-workflow-cases.json >/dev/null 2>&1 || test ! -f evals/charlies-workflow-cases.json

      - name: Validate bundled skills and contracts
        run: ./scripts/validate.sh

      - name: Exercise installer
        run: |
          target="$RUNNER_TEMP/codex/skills"
          ./scripts/install.sh --harness codex --target-dir "$target" --dry-run
          ./scripts/install.sh --harness codex --target-dir "$target"
          ./scripts/validate.sh --skills-dir "$target"
          test "$(find skills -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')" = \
            "$(find "$target" -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')"
